name: browser-tests

on:
  pull_request:
  push:
    branches: [main, 'codex/browserstack-*']
  workflow_dispatch:
    inputs:
      browserstack:
        description: '同時執行 BrowserStack 雲端回歸'
        type: boolean
        default: true

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  local:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/browser/requirements.txt
      - name: TLS 測試代理的本機目標限制
        run: python scripts/browser/check_tls_proxy.py
      - name: 本機瀏覽器回歸
        run: python -m pytest scripts/browser/test_regression.py -q --browser-channel msedge --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/local.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-local-results
          path: test-results/
          retention-days: 7

  browserstack:
    if: (github.event_name == 'workflow_dispatch' && inputs.browserstack) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/browserstack-'))
    needs: local
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 確認憑證已設定
        shell: python
        run: |
          import os
          missing = [key for key in ('BROWSERSTACK_USERNAME', 'BROWSERSTACK_ACCESS_KEY') if not os.environ.get(key)]
          if missing:
              raise SystemExit('缺少 repository secrets：' + ', '.join(missing))
      - run: python -m pip install -r scripts/browser/requirements-browserstack.txt
      - name: BrowserStack Automate 與 Local tunnel
        run: browserstack-sdk pytest scripts/browser/test_regression.py -q --tracing retain-on-failure --screenshot only-on-failure --junitxml=test-results/browserstack.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browserstack-results
          path: test-results/
          retention-days: 7

  ui-review:
    if: (github.event_name == 'workflow_dispatch' && inputs.browserstack) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/codex/browserstack-'))
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        profile: [chrome, edge, firefox, webkit, android, ios]
    env:
      UI_PROFILE: ${{ matrix.profile }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/browser/requirements-visual.txt
      - name: 跨環境 UI 截圖與版面檢查
        run: python -m pytest scripts/browser/test_ui_review.py -q --junitxml=test-results/ui.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-${{ matrix.profile }}
          path: test-results/
          retention-days: 7
