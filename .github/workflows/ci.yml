name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 與 release.yml 同為 Windows runner，避免「CI 綠、發版紅」的平台差異
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # .gitattributes 已固定 eol=lf，檢出後 gofmt 不應有差異
      - name: gofmt
        run: test -z "$(gofmt -l internal cmd)"

      - name: Windows 版本資源
        run: |
          export PATH="/c/mingw64/bin:$PATH"
          go generate ./cmd/desktop

      # docs/spec/backend-architecture.md 第 7 節的驗證清單
      - name: go vet
        run: go vet ./internal/... ./cmd/...

      - name: 前端分層檢查
        run: node scripts/frontend-layering.test.cjs

      # tailwind.css 是提交進 repo 的產生檔；改了 className／tailwind.config 卻沒重產會在這裡失敗
      - name: Tailwind CSS 是否最新
        run: python scripts/build-css.py --check

      - name: 前端單元測試
        run: node --test scripts/*.test.cjs

      - name: 後端測試（含 internal/arch 分層檢查）
        run: go test ./internal/... ./cmd/...

      - name: 後端測試（production 標籤，前端嵌入）
        run: go test -tags production ./internal/...

      # scripts/*.test.py 需要 Playwright 與本機瀏覽器，不在 CI 跑（見 CONTRIBUTING.md）
