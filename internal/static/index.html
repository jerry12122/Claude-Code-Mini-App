  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: (function () {
            const alpha = '<alpha-value>';
            const ra = {};
            for (const k of ['bg', 'sunken', 'card', 'raised', 'active', 'line-soft', 'line', 'line-strong', 'thumb', 't1', 't2', 't3', 't4', 't5', 'accent-text', 'warn', 'ok']) {
              ra[k] = 'oklch(var(--ra-' + k + ') / ' + alpha + ')';
            }
            const steps = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
            const gray = {};
            const slate = {};
            for (const n of steps) {
              gray[n] = 'rgb(var(--gray-' + n + ') / ' + alpha + ')';
              slate[n] = 'rgb(var(--slate-' + n + ') / ' + alpha + ')';
            }
            const accents = ['violet', 'orange', 'sky', 'emerald'];
            const accentSteps = [100, 200, 300, 400];
            const deepAccentSteps = [50, 100, 200, 300, 400, 800, 900, 950];
            const deepAccents = ['amber', 'red', 'yellow'];
            const out = { ra, gray, slate };
            for (const name of accents) {
              out[name] = {};
              for (const n of accentSteps) out[name][n] = 'rgb(var(--' + name + '-' + n + ') / ' + alpha + ')';
            }
            for (const name of deepAccents) {
              out[name] = {};
              for (const n of deepAccentSteps) out[name][n] = 'rgb(var(--' + name + '-' + n + ') / ' + alpha + ')';
            }
            return out;
          })(),
        },
      },
    };
  </script>
