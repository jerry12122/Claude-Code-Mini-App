<!DOCTYPE html>

<head>
  <!-- 必須最先載入：視窗載入外部 URL 時 Wails runtime 不會就緒，這段會送出 wails:runtime:ready 讓 Go 端 flush ExecJS 佇列 -->

  <title>Claude Code · Remote Agent</title>
  <link rel="icon" href="./favicon.ico" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>Babel.registerPreset('react-classic', { presets: [[Babel.availablePresets['react'], { runtime: 'classic' }]] });</script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <style>
    :root {
      --tg-content-safe-top: 0px;
      --ra-bg0: oklch(0.15 0.02 264);
      --ra-bg1: oklch(0.13 0.02 264);
      --ra-surface: oklch(0.19 0.02 264);
      --ra-border: oklch(0.28 0.02 264);
      --ra-accent: oklch(0.62 0.19 275);
      --ra-accent-soft: oklch(0.62 0.19 275 / 18%);
      --ra-text: oklch(0.94 0.01 264);
      --ra-muted: oklch(0.55 0.01 264);
      /* Markdown 顏色：可由 Settings 彈窗自訂，覆寫時直接改這三個變數即可，不用動下面的規則。 */
      --md-heading-color: oklch(0.78 0.15 65);
      --md-bold-color: oklch(0.72 0.07 145);
      --md-code-color: oklch(0.63 0.12 275);
    }
    body.ra-body {
      background: var(--ra-bg0);
      color: var(--ra-text);
      font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    }
    /* 對話文字大小（--ra-chat-fs，預設 14px = 原 text-sm）。加 body 前綴是為了贏過執行時才插入的 Tailwind .text-sm。
       其餘字級按原本 px 與 14px 的比例換算，預設值下畫面不變。 */
    body .prose, body .bubble-user, body .bubble-shell { font-size: var(--ra-chat-fs, 14px); }
    body .bubble-shell pre { font-size: calc(var(--ra-chat-fs, 14px) * 0.857143); }
    body .ra-msg-time { font-size: calc(var(--ra-chat-fs, 14px) * 0.714286); }
    body textarea[data-chat-input] {
      font-size: calc(var(--ra-chat-fs, 14px) * 0.964286);
      max-height: min(40vh, 240px);
    }
    .ra-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    /* 桌面更新視窗的更新說明（Markdown 子集，標籤與 class 皆由 desktop-update.js 產生） */
    .ra-notes { font-size: 12.5px; line-height: 1.65; color: oklch(0.85 0.01 264); overflow-wrap: anywhere; }
    .ra-notes > :first-child { margin-top: 0; }
    .ra-notes > :last-child { margin-bottom: 0; }
    .ra-notes-h3 { font-size: 14px; font-weight: 700; color: oklch(0.95 0.01 264); margin: 14px 0 6px; }
    .ra-notes-h4 { font-size: 13px; font-weight: 600; color: oklch(0.9 0.02 280); margin: 12px 0 4px; padding-bottom: 3px; border-bottom: 1px solid oklch(0.28 0.02 264); }
    .ra-notes-h5 { font-size: 12.5px; font-weight: 600; color: oklch(0.85 0.01 264); margin: 10px 0 3px; }
    .ra-notes-p { margin: 6px 0; }
    .ra-notes-ul, .ra-notes-ol { margin: 4px 0 8px; padding-left: 20px; }
    .ra-notes-ul { list-style: disc; }
    .ra-notes-ol { list-style: decimal; }
    .ra-notes li { margin: 3px 0; }
    .ra-notes li::marker { color: oklch(0.62 0.19 275); }
    .ra-notes strong { color: oklch(0.95 0.01 264); font-weight: 600; }
    .ra-notes-code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; padding: 1px 5px; border-radius: 4px; background: oklch(0.22 0.02 264); color: oklch(0.82 0.1 275); }
    .ra-notes-pre { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: oklch(0.13 0.02 264); border: 1px solid oklch(0.26 0.02 264); overflow-x: auto; }
    .ra-notes-pre code { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; white-space: pre; }
    .ra-notes-bq { margin: 8px 0; padding: 2px 10px; border-left: 3px solid oklch(0.62 0.19 275 / 60%); color: oklch(0.75 0.01 264); }
    .ra-notes-hr { border: 0; border-top: 1px solid oklch(0.28 0.02 264); margin: 10px 0; }
    .ra-display { font-family: 'Manrope', sans-serif; font-weight: 800; letter-spacing: -0.02em; }
    .h-app { height: var(--tg-viewport-height, 100svh); }
    @media (max-width: 767px) {
      input, textarea, select { font-size: 16px !important; }
      /* 手機輸入框不可小於 16px（iOS 聚焦時會自動放大），調大時才跟著變 */
      body textarea[data-chat-input] { font-size: max(16px, var(--ra-chat-fs, 14px)) !important; }
    }
    .prose pre {
      position: relative; margin: 0.6em 0; overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%;
      background: oklch(0.16 0.02 264); border: 1px solid oklch(0.28 0.02 264); border-radius: 8px;
      padding: 1.9em 0.9em 0.9em;
    }
    .prose pre[data-lang]::before {
      content: attr(data-lang);
      position: absolute; top: 0; left: 0; padding: 0.2em 0.7em;
      font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 0.72em; letter-spacing: 0.03em;
      color: oklch(0.62 0.03 264); background: oklch(0.21 0.02 264);
      border-radius: 8px 0 6px 0; text-transform: lowercase;
    }
    .prose pre code { white-space: pre; font-family: 'JetBrains Mono', ui-monospace, monospace; background: transparent; }
    .prose pre code.hljs { background: transparent; padding: 0; display: inline; }
    .code-copy-btn {
      position: absolute; top: 0.35em; right: 0.35em; z-index: 1;
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; padding: 0; border: none; border-radius: 6px;
      background: oklch(0.24 0.02 264 / 0.7); color: oklch(0.7 0.02 264);
      cursor: pointer; opacity: 0; transition: opacity 0.15s, background 0.15s, color 0.15s;
    }
    .prose pre:hover .code-copy-btn { opacity: 1; }
    .code-copy-btn:hover { background: oklch(0.3 0.02 264); color: oklch(0.92 0.01 264); }
    .code-copy-btn.copied { opacity: 1; color: oklch(0.75 0.15 145); }
    @media (hover: none) { .code-copy-btn { opacity: 1; } }
    /* 觸控裝置：訊息交給長按選單，關掉原生 callout 與選字避免兩者打架 */
    @media (hover: none) and (pointer: coarse) {
      .msg-lp {
        -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: transform 0.12s ease-out, opacity 0.12s ease-out;
      }
      /* 按住一小段時間後給回饋，讓人知道長按有被偵測到 */
      .msg-lp.msg-pressing { transform: scale(0.985); opacity: 0.8; }
    }
    @keyframes msg-pop-in { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .msg-pop { animation: msg-pop-in 0.14s ease-out; }
    .prose code:not(pre code) {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      background: transparent; padding: 0; border-radius: 0; font-size: 0.92em;
      color: var(--md-code-color);
    }
    .prose p { margin: 0.5em 0; line-height: 1.8; }
    .prose ul, .prose ol { padding-left: 1.5em; margin: 0.5em 0; }
    .prose h1,.prose h2,.prose h3 { font-weight: 700; margin: 0.75em 0 0.25em; color: var(--md-heading-color); }
    .prose h1 { font-size: 1.25em; }
    .prose h2 { font-size: 1.15em; }
    .prose h3 { font-size: 1.08em; }
    .prose strong { color: var(--md-bold-color); font-weight: 700; }
    .prose table { border-collapse: collapse; min-width: 100%; }
    .prose table th, .prose table td { border: 1px solid oklch(0.28 0.02 264); padding: 0.3em 0.75em; white-space: nowrap; }
    .prose table th { background: oklch(0.22 0.02 264); font-weight: 600; }
    .prose .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0.5em 0; }
    .prose img.chat-img { max-width: 240px; max-height: 240px; width: auto; height: auto; border-radius: 8px; display: block; margin: 0.5em 0; cursor: zoom-in; }
    .ra-lightbox-svg-container svg {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain;
      pointer-events: auto;
    }
    /* 1a：使用者實心紫泡泡；Claude 無邊框文件流 */
    .bubble-claude {
      background: transparent;
      border: none;
      border-radius: 0;
      overflow: hidden; min-width: 0;
      padding: 0 !important;
    }
    .bubble-user {
      background: oklch(0.62 0.19 275);
      border: none;
      color: white;
      border-radius: 14px 14px 4px 14px;
      overflow: hidden; min-width: 0;
      box-shadow: 0 8px 24px oklch(0.62 0.19 275 / 18%);
    }
    .bubble-shell {
      background: oklch(0.12 0.01 264);
      border: 1px solid oklch(0.3 0.02 264);
      border-radius: 12px;
      overflow: hidden; min-width: 0;
    }
    .ra-cmd-bar {
      display: flex;
      /* 輸入框獨佔第一行（JSX 以 order-first + w-full 排在最前），按鈕列換到第二行 */
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 10px;
      background: oklch(0.19 0.02 264);
      border: 1px solid oklch(0.3 0.02 264);
      border-radius: 14px;
      padding: 8px 12px;
      min-width: 0;
    }
    .ra-cmd-bar.shell {
      background: #120d00;
      border-color: rgba(180, 83, 9, 0.45);
    }
    .ra-cmd-badge {
      font-size: 12px;
      font-weight: 600;
      color: oklch(0.65 0.19 275);
      background: oklch(0.62 0.19 275 / 16%);
      border-radius: 7px;
      padding: 5px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .ra-cmd-badge.shell {
      color: #fcd34d;
      background: rgba(180, 83, 9, 0.28);
    }
    .ra-session-card {
      margin: 1px 0;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ra-session-card:hover {
      background: oklch(0.62 0.19 275 / 8%);
      border-color: oklch(0.62 0.19 275 / 22%);
    }
    .ra-session-card.active {
      background: oklch(0.24 0.03 270);
      border-color: oklch(0.72 0.17 275 / 75%);
      box-shadow: inset 0 0 0 1px oklch(0.72 0.17 275 / 75%);
    }
    .ra-session-card.unread {
      background: oklch(0.62 0.19 275 / 17%);
    }
    .ra-session-card.unread:hover {
      background: oklch(0.62 0.19 275 / 24%);
    }
    .ra-status-dot {
      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    }
    .ra-status-dot.running { background: oklch(0.75 0.15 70); }
    .ra-status-dot.awaiting { background: oklch(0.75 0.15 70); }
    .ra-status-dot.unread { background: #a78bfa; }
    .ra-unread-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9999px;
      background-color: rgb(124 58 237);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
      flex-shrink: 0;
    }

    @keyframes streaming-dots {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    .streaming-tail {
      display: inline-block;
      margin-left: 0.1em;
      letter-spacing: 0.02em;
      color: oklch(0.75 0.14 275);
      animation: streaming-dots 1s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; }
    }
    .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: oklch(0.62 0.19 275); margin: 0 2px; animation: pulse-dot 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    .app-scroll {
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: oklch(0.4 0.02 264) transparent;
      overscroll-behavior-y: contain;
    }
    .app-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .app-scroll::-webkit-scrollbar-track { background: transparent; }
    .app-scroll::-webkit-scrollbar-thumb {
      background: oklch(0.4 0.02 264);
      border-radius: 8px;
    }
    .app-scroll::-webkit-scrollbar-thumb:hover {
      background: oklch(0.5 0.08 275);
    }
    @keyframes ra-fade-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .ra-card-enter { animation: ra-fade-in 0.35s ease-out both; }
  </style>
  <!-- 對話文字大小：每個裝置各自的偏好（localStorage），在 React 載入前先套，避免先閃一下預設大小。 -->
  <script>try{var f=parseInt(localStorage.getItem('cc_chat_fs_v1'),10);if(f>=12&&f<=22)document.documentElement.style.setProperty('--ra-chat-fs',f+'px')}catch(e){}</script>
  <!-- Settings 彈窗的「自訂 CSS」寫入這裡；預設空白，不影響任何樣式。 -->
  <style id="ra-custom-css"></style>
</head>
